<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VERTICAL</title>
<meta name="description" content="Programa de fuerza para baloncesto: rutinas, cargas y progreso.">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VERTICAL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-startup-image" href="splash-dark.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)">
<link rel="apple-touch-startup-image" href="splash-light.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"><style>
/* ================= VERTICAL =================
   Oscuro  = pista en sombra (cuero, hierro, cal)
   Claro   = parqué de arce con las mismas líneas de cal
   ============================================ */

/* Paleta neutra moderna. Los nombres de token se mantienen (court/chalk/panel…)
   para no tocar el resto del CSS ni app.js; solo cambian los valores.
   Spotify sigue pisando --leather / --leather-soft / --ambiente en caliente. */
:root {
  /* claro — fondo blanco, grises fríos */
  --court: #F4F5F8;
  --court-2: #EAECF1;
  --panel: #FFFFFF;
  --panel-2: #F3F4F7;
  --hair: #E4E5EA;
  --hair-soft: #EDEEF2;
  --chalk: #14151A;
  --chalk-dim: #565961;
  --chalk-mute: #8B8E98;
  --leather: #E24D18;
  --leather-soft: #FCEAE1;
  --rim: #B45309;
  --iron: #6B7280;
  --gear: #CBD0D8;
  --shadow: 0 1px 2px rgba(18, 20, 28, .05), 0 10px 30px rgba(18, 20, 28, .06);

  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --f-num: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;

  --r: 18px;
  --gut: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --court: #0B0B0D;
    --court-2: #141417;
    --panel: #161619;
    --panel-2: #1F1F24;
    --hair: #2B2B32;
    --hair-soft: #212127;
    --chalk: #F3F3F5;
    --chalk-dim: #9A9CA5;
    --chalk-mute: #6C6E78;
    --leather: #FB6A32;
    --leather-soft: #2A1A12;
    --rim: #F59E42;
    --iron: #8A8D96;
    --gear: #3A3A42;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 32px rgba(0, 0, 0, .42);
  }
}

:root[data-theme="dark"] {
  --court: #0B0B0D;
  --court-2: #141417;
  --panel: #161619;
  --panel-2: #1F1F24;
  --hair: #2B2B32;
  --hair-soft: #212127;
  --chalk: #F3F3F5;
  --chalk-dim: #9A9CA5;
  --chalk-mute: #6C6E78;
  --leather: #FB6A32;
  --leather-soft: #2A1A12;
  --rim: #F59E42;
  --iron: #8A8D96;
  --gear: #3A3A42;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 32px rgba(0, 0, 0, .42);
}

:root[data-theme="light"] {
  --court: #F4F5F8;
  --court-2: #EAECF1;
  --panel: #FFFFFF;
  --panel-2: #F3F4F7;
  --hair: #E4E5EA;
  --hair-soft: #EDEEF2;
  --chalk: #14151A;
  --chalk-dim: #565961;
  --chalk-mute: #8B8E98;
  --leather: #E24D18;
  --leather-soft: #FCEAE1;
  --rim: #B45309;
  --iron: #6B7280;
  --gear: #CBD0D8;
  --shadow: 0 1px 2px rgba(18, 20, 28, .05), 0 10px 30px rgba(18, 20, 28, .06);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Altura en unidades de viewport dinamico, no en porcentajes.
   Con height:100% iOS resuelve el alto contra la ventana de maquetacion, que en
   una app instalada no coincide con la pantalla real cuando la pagina no llega
   a hacer scroll. Resultado: la barra de pestañas, que va anclada con
   bottom:0, se quedaba flotando con un hueco debajo en las pantallas cortas. */
html, body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  /* Quita el doble-toque-zoom de iOS; el pellizco para ampliar sigue funcionando. */
  touch-action: manipulation;
}

body {
  background: var(--court);
  color: var(--chalk);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--leather); outline-offset: 2px; border-radius: 6px; }

/* ---------- shell ---------- */
/* El shell llena siempre la pantalla, tenga la pestaña mucho contenido o poco,
   para que todas se comporten igual. */
#app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column;
}

.screen {
  flex: 1;
  padding: 0 var(--gut) calc(96px + env(safe-area-inset-bottom));
  max-width: 720px; width: 100%; margin: 0 auto;
}

/* Cabecera con la curva del triple */
.hdr {
  position: relative;
  padding: calc(env(safe-area-inset-top) + 18px) 0 14px;
  overflow: hidden;
}
/* Si la marca ya ha reservado el hueco del notch, la cabecera no lo repite. */
.screen > div:first-child + .hdr { padding-top: 12px; }
.hdr .arc {
  position: absolute; inset: auto 0 -46px -10%;
  width: 120%; height: 120px; pointer-events: none;
  border-top: 1.5px solid var(--hair);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  opacity: .8;
}
.hdr h1 {
  margin: 0; font-size: 33px; line-height: 1.08; letter-spacing: -.03em; font-weight: 720;
  text-wrap: balance;
}
.eyebrow {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--chalk-mute); margin: 0 0 4px;
}
.sub { margin: 6px 0 0; color: var(--chalk-dim); font-size: 14.5px; }

/* ---------- tabs ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 8px 6px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--court) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(18px);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--hair-soft);
}
.tabbar button {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 2px; color: var(--chalk-mute); border-radius: 10px;
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
}
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="true"] { color: var(--leather); }

/* ---------- tarjetas ---------- */
.card {
  background: var(--panel); border: 1px solid var(--hair-soft);
  border-radius: var(--r); box-shadow: var(--shadow);
}
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }

.sect-title {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--chalk-mute);
  margin: 0 0 10px; display: flex; align-items: center; gap: 10px;
}
.sect-title::after { content: ""; flex: 1; height: 1px; background: var(--hair-soft); }

/* ---------- HOY: tarjeta de sesión ---------- */
.today {
  padding: 18px; display: flex; flex-direction: column; gap: 16px;
  position: relative; overflow: hidden;
}
.today .slot {
  display: inline-flex; align-items: baseline; gap: 8px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--leather);
}
.today h2 { margin: 0; font-size: 27px; letter-spacing: -.028em; line-height: 1.1; font-weight: 680; }
.today .meta { display: flex; gap: 18px; color: var(--chalk-dim); font-size: 13.5px; }
.today .meta b { font-family: var(--f-num); font-size: 17px; color: var(--chalk); font-weight: 600; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: 13px;
  background: var(--leather); color: #FFFFFF;
  font-weight: 600; font-size: 16.5px; letter-spacing: -.01em;
  transition: transform .12s ease, filter .12s ease;
}
.btn:active { transform: scale(.985); filter: brightness(.94); }
.btn-ghost {
  background: none; color: var(--chalk); border: 1px solid var(--hair);
  min-height: 46px; font-weight: 500; font-size: 15.5px;
}
.btn-sm { min-height: 38px; font-size: 14.5px; padding: 0 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- calendario semanal ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.week > div {
  text-align: center; padding: 9px 2px 10px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--hair-soft);
}
.week .d { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--chalk-mute); }
.week .m { font-family: var(--f-num); font-size: 15px; font-weight: 650; margin-top: 3px; }
.week .gym { background: var(--leather-soft); border-color: color-mix(in srgb, var(--leather) 32%, transparent); }
.week .gym .m { color: var(--leather); }
.week .now { outline: 2px solid var(--chalk); outline-offset: -2px; }
.week .off .m { color: var(--chalk-mute); font-weight: 500; }

/* ---------- lista de ejercicios ---------- */
.exrow {
  display: flex; align-items: center; gap: 13px; padding: 11px 13px;
  width: 100%; text-align: left; border-radius: 13px;
  background: var(--panel); border: 1px solid var(--hair-soft);
}
.exrow .thumb {
  flex: 0 0 78px; height: 60px; border-radius: 9px;
  background: var(--court-2); border: 1px solid var(--hair-soft); overflow: hidden;
}
.exrow .thumb canvas { display: block; width: 100%; height: 100%; }
.exrow .nm { flex: 1; min-width: 0; }
.exrow .nm strong { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; }
.exrow .nm span { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--chalk-mute); margin-top: 2px; }
.exrow .prog { font-family: var(--f-num); font-size: 14px; font-weight: 650; color: var(--chalk-mute); }
.exrow.done { border-color: color-mix(in srgb, var(--leather) 40%, transparent); }
.exrow.done .prog { color: var(--leather); }

/* ---------- ficha de ejercicio ---------- */
.stage {
  height: 236px; border-radius: 14px; overflow: hidden;
  background: var(--court-2); border: 1px solid var(--hair-soft);
  position: relative;
}
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .badge {
  position: absolute; top: 10px; left: 10px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--chalk-mute); background: color-mix(in srgb, var(--court) 70%, transparent);
  padding: 4px 8px; border-radius: 7px;
}

.cues { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.cues li { display: flex; gap: 11px; font-size: 14.5px; color: var(--chalk-dim); line-height: 1.42; }
.cues li b {
  flex: 0 0 auto; font-family: var(--f-mono); font-size: 11px; color: var(--leather);
  padding-top: 3px; font-weight: 400;
}
.transfer {
  padding: 13px 15px; border-radius: 12px;
  background: var(--leather-soft); color: var(--chalk);
  font-size: 14.5px; line-height: 1.42;
  border: 1px solid color-mix(in srgb, var(--leather) 24%, transparent);
}

/* ---------- registro de series ---------- */
.sets { display: flex; flex-direction: column; gap: 8px; }
.setrow {
  display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; align-items: center;
}
.setrow .n {
  font-family: var(--f-mono); font-size: 12px; color: var(--chalk-mute); text-align: center;
}
.fld { position: relative; }
.fld input {
  width: 100%; height: 46px; padding: 14px 8px 2px; text-align: center;
  background: var(--panel-2); border: 1px solid var(--hair); border-radius: 11px;
  font-family: var(--f-num); font-size: 19px; font-weight: 650; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.fld input::placeholder { color: var(--chalk-mute); font-weight: 500; }
.fld label {
  position: absolute; top: 4px; left: 0; right: 0; text-align: center;
  font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--chalk-mute); pointer-events: none;
}
.tick {
  height: 46px; border-radius: 11px; border: 1px solid var(--hair);
  display: flex; align-items: center; justify-content: center;
  color: var(--chalk-mute); background: var(--panel-2);
  transition: background .14s ease, color .14s ease, border-color .14s ease;
}
.tick svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.setrow.done .tick { background: var(--leather); border-color: var(--leather); color: #FFFFFF; }
.setrow.done .fld input { color: var(--chalk); border-color: color-mix(in srgb, var(--leather) 38%, transparent); }

.hint {
  font-family: var(--f-mono); font-size: 11px; color: var(--chalk-mute);
  display: flex; justify-content: space-between; gap: 10px;
}
.hint b { color: var(--chalk-dim); font-weight: 400; }

/* ---------- descanso ---------- */
.rest {
  position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom));
  z-index: 45; padding: 0 var(--gut);
  max-width: 720px; margin: 0 auto;
  transform: translateY(200%); opacity: 0; visibility: hidden;
  transition: transform .28s cubic-bezier(.32, .72, 0, 1), opacity .2s ease, visibility 0s .28s;
}
.rest.on { transform: none; opacity: 1; visibility: visible; transition-delay: 0s; }
.rest-in {
  position: relative; overflow: hidden;
  background: var(--panel-2); border: 1px solid var(--hair);
  border-radius: 14px; box-shadow: var(--shadow);
  padding: 12px 15px; display: flex; align-items: center; gap: 14px;
}
.rest .fill {
  position: absolute; inset: 0 auto 0 0; width: 0%;
  background: var(--leather-soft); transition: width .95s linear;
}
.rest .txt { position: relative; flex: 1; }
.rest .txt .lbl { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-mute); }
.rest .txt .t { font-family: var(--f-num); font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rest .acts { position: relative; display: flex; gap: 7px; }

/* ---------- progreso ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { padding: 14px 15px; border-radius: 13px; background: var(--panel); border: 1px solid var(--hair-soft); }
.kpi .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--chalk-mute); }
.kpi .v { font-family: var(--f-num); font-size: 27px; font-weight: 700; letter-spacing: -.025em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; font-weight: 600; color: var(--chalk-mute); margin-left: 2px; }
.kpi .d { font-family: var(--f-mono); font-size: 10.5px; color: var(--chalk-mute); margin-top: 2px; }
.kpi .d.up { color: var(--leather); }

.chart { padding: 14px; border-radius: 13px; background: var(--panel); border: 1px solid var(--hair-soft); }
.chart canvas { display: block; width: 100%; height: 148px; }
.chart .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
.chart .top strong { font-size: 15px; font-weight: 600; letter-spacing: -.012em; }
.chart .top span { font-family: var(--f-num); font-size: 15px; font-weight: 650; color: var(--leather); }

.pr {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px;
  border-radius: 12px; background: var(--panel); border: 1px solid var(--hair-soft);
}
.pr .nm { flex: 1; font-size: 14.5px; }
.pr .val { font-family: var(--f-num); font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.pr .dt { font-family: var(--f-mono); font-size: 10.5px; color: var(--chalk-mute); }

/* ---------- varios ---------- */
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--hair);
  font-size: 13.5px; color: var(--chalk-dim); background: var(--panel);
}
.chip[aria-pressed="true"] { background: var(--chalk); color: var(--court); border-color: var(--chalk); }

.empty {
  text-align: center; padding: 34px 20px; color: var(--chalk-mute);
  font-size: 14.5px; line-height: 1.5;
}

.sheet-bg {
  position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .45);
  opacity: 0; pointer-events: none; transition: opacity .24s ease;
}
.sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  background: var(--court); border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--hair);
  padding: 8px var(--gut) calc(20px + env(safe-area-inset-bottom));
  max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  max-width: 720px; margin: 0 auto;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32, .72, 0, 1);
}
.sheet.on { transform: none; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--hair); margin: 6px auto 14px; }

.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 15px;
  background: var(--panel); border: 1px solid var(--hair-soft); border-radius: 13px;
}
.row .lb { flex: 1; font-size: 15px; }
.row .rb { font-family: var(--f-num); font-size: 15px; font-weight: 600; color: var(--chalk-mute); }

/* ---------- el color de la música ----------
   El tono lo inyecta spotify.js sobre --leather, --leather-soft y --ambiente.
   El fondo y los textos no se tocan nunca: el contraste no depende del disco. */
/* Sin transiciones aquí, a propósito. Cuando una propiedad tiene transición y
   su valor sale de una variable, el navegador no la reevalúa al cambiar la
   variable: se queda pintando el valor viejo. Costó encontrarlo, porque la
   variable sí cambiaba y solo fallaba lo que se veía.

   La transparencia va dentro del propio degradado: sin --ambiente el color es
   "transparent" y la capa desaparece sola, sin depender de la opacidad. */
.ambiente {
  position: fixed; inset: 0 0 auto 0; height: 60vh; z-index: -1;
  pointer-events: none; opacity: 1;
  background: radial-gradient(125% 95% at 50% 0%,
    color-mix(in srgb, var(--ambiente, transparent) 46%, transparent) 0%,
    transparent 82%);
}

/* Lo que suena, dentro de la barra de descanso */
.rest .pista {
  position: relative; display: flex; align-items: center; gap: 8px;
  min-width: 0; max-width: 46%;
}
.rest .pista img {
  width: 30px; height: 30px; border-radius: 5px; flex: 0 0 auto;
  object-fit: cover; background: var(--panel);
}
.rest .pista span {
  min-width: 0; font-size: 11.5px; line-height: 1.25; color: var(--chalk-dim);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}

.mono-hint {
  font-family: var(--f-mono); font-size: 11px; color: var(--chalk-mute);
  line-height: 1.5; word-break: break-all;
}

/* botones − / + para ajustar el descanso */
.rest-adj {
  width: 32px; height: 32px; flex: 0 0 auto; border-radius: 10px;
  border: 1px solid var(--hair); background: var(--panel-2);
  color: var(--chalk-dim); font-family: var(--f-num); font-size: 19px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; line-height: 1;
  transition: transform .1s ease, background .12s ease;
}
.rest-adj:active { transform: scale(.92); background: var(--court-2); }

/* entrada de texto del entrenador IA */
.ia-in {
  width: 100%; border: 0; background: transparent; color: var(--chalk);
  font: inherit; font-size: 15px; line-height: 1.45; resize: vertical;
  outline: none; min-height: 62px; display: block;
}
.ia-in::placeholder { color: var(--chalk-mute); }

/* control segmentado / subpestañas (toque Hevy) */
.seg {
  display: flex; gap: 4px; padding: 4px;
  background: var(--court-2); border: 1px solid var(--hair-soft); border-radius: 13px;
}
.seg-b {
  flex: 1; padding: 8px 6px; border-radius: 10px; line-height: 1;
  font-size: 13.5px; font-weight: 600; color: var(--chalk-mute);

/* VERTICAL — motor de animación del muñeco.
   Cada ejercicio son keyframes de esqueleto 2D + material (barra, balón, cajón…).
   Espacio de dibujo: 220 × 170, suelo en y = 150. El muñeco mira a la derecha. */

const ANIM = (() => {
  const GROUND = 150;
  const W = 220, H = 170;

  /* Pose base de pie. Cada keyframe solo sobreescribe lo que cambia. */
  const B = {
    hd: [110, 36], nk: [110, 55], hp: [110, 93],
    e1: [115, 74], h1: [116, 95], e2: [105, 74], h2: [104, 95],
    k1: [112, 122], a1: [110, 150], k2: [108, 122], a2: [110, 150]
  };
  const P = o => Object.assign({}, B, o);
  const J = ['hd', 'nk', 'hp', 'e1', 'h1', 'e2', 'h2', 'k1', 'a1', 'k2', 'a2'];

  /* ---------- interpolación ---------- */
  const smooth = t => t * t * (3 - 2 * t);
  function poseAt(keys, t) {
    let i = 0;
    while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
    const [t0, p0] = keys[i], [t1, p1] = keys[i + 1];
    const u = t1 === t0 ? 0 : smooth((t - t0) / (t1 - t0));
    const out = {};
    for (const j of J) out[j] = [p0[j][0] + (p1[j][0] - p0[j][0]) * u, p0[j][1] + (p1[j][1] - p0[j][1]) * u];
    return out;
  }

  /* ---------- primitivas de dibujo ---------- */
  function seg(c, a, b, w, col) {
    c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  }
  function limb(c, a, b, d, w, col) { seg(c, a, b, w, col); seg(c, b, d, w * 0.85, col); }
  function dot(c, p, r, col) { c.fillStyle = col; c.beginPath(); c.arc(p[0], p[1], r, 0, 7); c.fill(); }

  /* Barra vista en escorzo: corta, con los discos de canto. */

  const fpOut = P({ hd: [104, 40], nk: [106, 58], hp: [108, 94], e1: [126, 60], h1: [148, 54], e2: [124, 62], h2: [146, 56], k1: [110, 122], a1: [108, 150], k2: [106, 122], a2: [108, 150] });
  const fpIn = P({ hd: [104, 40], nk: [106, 58], hp: [108, 94], e1: [128, 46], h1: [116, 34], e2: [126, 48], h2: [114, 36], k1: [110, 122], a1: [108, 150], k2: [106, 122], a2: [108, 150] });
  EXR.facepull = {
    dur: 2800, keys: [[0, fpOut], [.34, fpIn], [.5, fpIn], [.88, fpOut], [1, fpOut]],
    pre: (c, p, t, S) => cable(c, [206, 44], p.h1, S)
  };

  /* ---------- render ---------- */
  function draw(c, key, t, S, w, h, zoom) {
    const E = EXR[key]; if (!E) return;
    c.clearRect(0, 0, w, h);
    c.save();
    const s = Math.min(w / W, h / H) * (zoom || 1);
    c.translate((w - W * s) / 2, (h - H * s) / 2); c.scale(s, s);

    /* suelo: línea de cal */
    c.strokeStyle = S.faint; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(6, GROUND + 2); c.lineTo(W - 6, GROUND + 2); c.stroke();

    const p = poseAt(E.keys, t);
    if (E.pre) E.pre(c, p, t, S);

    limb(c, p.nk, p.e2, p.h2, 5, S.dim);
    limb(c, p.hp, p.k2, p.a2, 6, S.dim);
    seg(c, p.nk, p.hp, 11, S.chalk);
    dot(c, p.hd, 9.5, S.chalk);
    seg(c, p.hd, p.nk, 5, S.chalk);
    limb(c, p.nk, p.e1, p.h1, 5.4, S.chalk);
    limb(c, p.hp, p.k1, p.a1, 6.4, S.chalk);

    if (E.post) E.post(c, p, t, S);
    c.restore();
  }

  /* Bucle único para todos los canvas visibles. */
  const live = new Set();
  let raf = null, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function style() {
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    return {
      chalk: v('--chalk'), dim: v('--chalk-dim'), faint: v('--hair'),
      leather: v('--leather'), iron: v('--iron'), gear: v('--gear'),
      cable: v('--iron'), band: v('--rim'), court: v('--court')
    };
  }

  function tick(now) {
    const S = style();
    for (const el of live) {
      const E = EXR[el.dataset.anim]; if (!E) continue;
      const t = reduced ? 0.42 : (now % E.dur) / E.dur;
      draw(el._ctx, el.dataset.anim, t, S, el._w, el._h, el._zoom);
    }
    raf = live.size ? requestAnimationFrame(tick) : null;
  }

  function mount(el) {
    const dpr = Math.min(devicePixelRatio || 1, 3);
    const r = el.getBoundingClientRect();
    el._w = Math.round(r.width) || 220;
    el._h = Math.round(r.height) || 170;
    el._zoom = parseFloat(el.dataset.zoom) || 1;
    el.width = el._w * dpr; el.height = el._h * dpr;
    el._ctx = el.getContext('2d');
    el._ctx.scale(dpr, dpr);
    live.add(el);
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function unmountAll() { live.clear(); }

  return { mount, unmountAll, keys: () => Object.keys(EXR), draw, style };
})();


/* VERTICAL — el color de la app sigue a lo que suena en Spotify.
   Flujo OAuth con PKCE: el inicio de sesión ocurre en la página de Spotify y
   esta app solo recibe un permiso temporal. Aquí nunca hay contraseñas.
   El Client ID es público por diseño en PKCE; no hay ningún secreto guardado. */

const SPOT = (() => {
  const K = 'vertical.spotify';
  const SCOPE = 'user-read-currently-playing';
  const POLL = 6000;
  /* Debe coincidir exactamente con la URI registrada en el panel de Spotify. */
  const REDIRECT = location.origin + location.pathname;

  /* Client ID de la app registrada en el panel de Spotify. Es público por diseño
     en PKCE (no es un secreto): va aquí para que la app venga ya configurada.
     Tiene que quedar declarado ANTES de la llamada a cargar(), que lo usa. */
  const CLIENT_ID = '0cdb08bef0024c469f548081ee7af11d';

  let st = cargar();
  let iv = null, ultimaPortada = null, alEscuchar = null;

  function cargar() {
    const base = { clientId: CLIENT_ID, token: '', refresh: '', exp: 0, on: true };
    try {
      const g = Object.assign({}, base, JSON.parse(localStorage.getItem(K) || '{}'));
      if (!g.clientId) g.clientId = CLIENT_ID;   // no dejar que un guardado viejo con '' lo borre
      return g;
    }
    catch (e) { return base; }
  }
  function guardar() { try { localStorage.setItem(K, JSON.stringify(st)); } catch (e) { } }

  /* ---------- PKCE ---------- */
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const aleatorio = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); };
  const sha256 = s => crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));

  async function conectar() {
    if (!st.clientId) throw new Error('Falta el Client ID');
    const verificador = aleatorio(48);
    sessionStorage.setItem(K + '.v', verificador);
    localStorage.setItem(K + '.v', verificador);   // sessionStorage se pierde al volver de Spotify
    const reto = b64url(await sha256(verificador));
    const u = new URL('https://accounts.spotify.com/authorize');
    u.search = new URLSearchParams({
      client_id: st.clientId, response_type: 'code', redirect_uri: REDIRECT,
      scope: SCOPE, code_challenge_method: 'S256', code_challenge: reto
    }).toString();
    location.href = u.toString();
  }

  /* Al volver de Spotify la URL trae ?code=... Se canjea por el permiso. */
  async function volviendoDeSpotify() {
    const p = new URLSearchParams(location.search);
    const code = p.get('code'), err = p.get('error');
    if (!code && !err) return null;
    history.replaceState({}, '', REDIRECT);        // deja la URL limpia
    if (err) return { ok: false, msg: err === 'access_denied' ? 'Has cancelado la conexión con Spotify.' : 'Spotify ha rechazado la conexión.' };

    const verificador = localStorage.getItem(K + '.v') || sessionStorage.getItem(K + '.v');
    if (!verificador) return { ok: false, msg: 'Se perdió la sesión de conexión. Inténtalo otra vez.' };
    try {
      const r = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'authorization_code', code, redirect_uri: REDIRECT,
          client_id: st.clientId, code_verifier: verificador
        })
      });
      const j = await r.json();
      if (!r.ok) return { ok: false, msg: j.error_description || 'No se pudo completar la conexión.' };
      aplicarToken(j);
      localStorage.removeItem(K + '.v');
      return { ok: true };
    } catch (e) { return { ok: false, msg: 'Sin conexión con Spotify.' }; }
  }

  function aplicarToken(j) {
    st.token = j.access_token;
    if (j.refresh_token) st.refresh = j.refresh_token;
    st.exp = Date.now() + (j.expires_in || 3600) * 1000 - 60000;   // un minuto de margen
    guardar();
  }

  async function renovar() {
    if (!st.refresh) return false;
    try {
      const r = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: st.refresh, client_id: st.clientId })
      });
      if (!r.ok) return false;
      aplicarToken(await r.json());
      return true;
    } catch (e) { return false; }
  }

  /* ---------- qué suena ---------- */
  async function sonando() {
    if (!st.token) return null;
    if (Date.now() > st.exp && !(await renovar())) return null;
    try {
      const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { Authorization: 'Bearer ' + st.token }
      });
      if (r.status === 204) return { parado: true };            // nada sonando
      if (r.status === 401) { return (await renovar()) ? sonando() : null; }
      if (!r.ok) return null;
      const j = await r.json();
      if (!j || !j.item) return { parado: true };
      const imgs = (j.item.album && j.item.album.images) || [];
      const orden = [...imgs].sort((a, b) => a.width - b.width);
      return {
        parado: !j.is_playing,
        titulo: j.item.name,
        artista: (j.item.artists || []).map(a => a.name).join(', '),
        portada: (orden.find(i => i.width >= 160) || orden[orden.length - 1] || {}).url || null
      };
    } catch (e) { return null; }
  }

  /* ---------- color ---------- */
  const rgbAHsl = (r, g, b) => {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    const l = (mx + mn) / 2;
    const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    return [h, s, l];
  };
  const hsl = (h, s, l) => `hsl(${h.toFixed(0)} ${(s * 100).toFixed(0)}% ${(l * 100).toFixed(0)}%)`;

  /* Saca el tono más característico de la portada: el más colorido, evitando
     los píxeles casi negros y casi blancos, que no dicen nada. */
  async function tonoDe(url) {
    return new Promise(res => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const N = 40;
          const cv = document.createElement('canvas'); cv.width = N; cv.height = N;
          const c = cv.getContext('2d', { willReadFrequently: true });
          c.drawImage(img, 0, 0, N, N);
          const d = c.getImageData(0, 0, N, N).data;
          let mejor = null;
          for (let i = 0; i < d.length; i += 4) {
            const [h, s, l] = rgbAHsl(d[i], d[i + 1], d[i + 2]);
            if (l < .12 || l > .93) continue;
            const nota = s * (1 - Math.abs(l - .5));
            if (!mejor || nota > mejor.nota) mejor = { nota, h, s, l };
          }
          res(mejor && mejor.s > .12 ? mejor.h : null);
        } catch (e) { res(null); }
      };
      img.onerror = () => res(null);
      img.src = url;
    });
  }

  /* El tono viaja; la luminosidad y la saturación se quedan dentro de una banda
     segura, para que el contraste con el fondo aguante con cualquier disco. */
  function pintar(tono) {
    const raiz = document.documentElement;
    if (tono == null) { despintar(); return; }
    const oscuro = matchMedia('(prefers-color-scheme: dark)').matches;
    const tema = raiz.getAttribute('data-theme');
    const esOscuro = tema === 'dark' || (tema !== 'light' && oscuro);

    const s = esOscuro ? .78 : .72;
    const l = esOscuro ? .56 : .38;
    raiz.style.setProperty('--leather', hsl(tono, s, l));
    raiz.style.setProperty('--leather-soft', hsl(tono, esOscuro ? .42 : .55, esOscuro ? .13 : .90));
    raiz.style.setProperty('--ambiente', hsl(tono, esOscuro ? .70 : .74, esOscuro ? .46 : .58));
    raiz.classList.add('con-musica');
  }
  function despintar() {
    const raiz = document.documentElement;
    raiz.style.removeProperty('--leather');
    raiz.style.removeProperty('--leather-soft');
    raiz.style.removeProperty('--ambiente');
    raiz.classList.remove('con-musica');
  }

  /* ---------- bucle ---------- */
  async function latido() {
    if (!st.token || !st.on) return;
    const p = await sonando();
    if (!p || p.parado) { if (alEscuchar) alEscuchar(null); return; }
    if (p.portada && p.portada !== ultimaPortada) {
      ultimaPortada = p.portada;
      pintar(await tonoDe(p.portada));
    }
    if (alEscuchar) alEscuchar(p);
  }
  function arrancar() {
    parar();
    if (!st.token || !st.on) return;
    latido();
    iv = setInterval(() => { if (document.visibilityState === 'visible') latido(); }, POLL);
  }
  function parar() { clearInterval(iv); iv = null; }

  function desconectar() {
    st.token = ''; st.refresh = ''; st.exp = 0; guardar();
    parar(); despintar(); ultimaPortada = null;
    if (alEscuchar) alEscuchar(null);
  }

  return {
    get estado() { return { conectado: !!st.token, clientId: st.clientId, on: st.on, redirect: REDIRECT }; },
    setClientId(v) { st.clientId = (v || '').trim(); guardar(); },
    setActivo(v) { st.on = !!v; guardar(); if (v) arrancar(); else { parar(); despintar(); ultimaPortada = null; } },
    onPista(fn) { alEscuchar = fn; },
    conectar, desconectar, arrancar, parar, volviendoDeSpotify,
    repintar() { ultimaPortada = null; latido(); }
  };
})();

/* VERTICAL — estado, navegación y pantallas. */

/* ============ estado ============ */
const KEY = 'vertical.v1';
const DEF = { v: 1, idx: 0, cycles: 0, log: [], active: null, body: [], jump: [], theme: 'auto', sound: true, restOff: 0, restEx: {} };

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEF);
    return Object.assign(structuredClone(DEF), JSON.parse(raw));
  } catch (e) { return structuredClone(DEF); }
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('No se han podido guardar los datos en este dispositivo.'); }
  }, 120);
}

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const today = () => new Date().toISOString().slice(0, 10);
const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DOWL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const fmtDate = d => { const x = new Date(d + 'T12:00'); return `${x.getDate()} ${['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][x.getMonth()]}`; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const topReps = r => Math.max(...(String(r).match(/\d+/g) || [0]).map(Number));

/* ---- descanso configurable (#1) ----
   restEx[ex] es el descanso base de un ejercicio (sustituye al del plan);
   restOff es un ajuste global que se suma a todos por igual. */
const RESTMIN = 10, RESTMAX = 1200;
const baseRest = it => (S.restEx && S.restEx[it.ex] != null) ? S.restEx[it.ex] : it.rest;
const restFor = it => Math.min(RESTMAX, Math.max(RESTMIN, baseRest(it) + (S.restOff || 0)));
const fmtRest = sec => sec >= 60 ? (sec / 60 % 1 ? (sec / 60).toFixed(1).replace('.', ',') : sec / 60) + ' min' : sec + ' s';

/* ============ sonido y aviso ============ */
let actx = null;
function beep(times = 3) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    for (let i = 0; i < times; i++) {
      const o = actx.createOscillator(), g = actx.createGain();
      const t0 = actx.currentTime + i * 0.19;
      o.frequency.value = i === times - 1 ? 1046 : 784;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.32, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      o.start(t0); o.stop(t0 + 0.16);
    }
  } catch (e) { /* sin audio disponible */ }
}
let toastT = null;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = el('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  Object.assign(t.style, {
    position: 'fixed', left: '50%', bottom: 'calc(120px + env(safe-area-inset-bottom))',
    transform: 'translateX(-50%)', zIndex: 90, background: 'var(--chalk)', color: 'var(--court)',
    padding: '10px 16px', borderRadius: '11px', fontSize: '14px', maxWidth: '86%',
    textAlign: 'center', boxShadow: 'var(--shadow)', opacity: '1', transition: 'opacity .3s'
  });
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = '0'; }, 2600);
}

/* ============ cronómetro de descanso ============
   Cuenta contra la hora real de fin (R.endAt), no restando de uno en uno.
   iOS congela el JavaScript cuando la app pasa a segundo plano, así que un
   contador que restara cada segundo se quedaría parado; con la hora de fin,
   al volver el tiempo restante es el correcto y, si ya se cumplió mientras
   estabas fuera, suena al reaparecer. (iOS no permite ejecutar de verdad en
   segundo plano ni avisar con la app cerrada; esto es lo máximo fiable.) */
const R = { endAt: 0, total: 0, iv: null };
function restante() { return Math.max(0, Math.round((R.endAt - Date.now()) / 1000)); }
function startRest(sec) {
  clearInterval(R.iv);
  R.total = sec; R.endAt = Date.now() + sec * 1000;
  paintRest(); $('#rest').classList.add('on');
  R.iv = setInterval(tickRest, 250);
}
function tickRest() {
  if (restante() <= 0) { stopRest(); beep(); toast('Descanso terminado. A por la siguiente.'); }
  else paintRest();
}
function stopRest() { clearInterval(R.iv); R.iv = null; $('#rest').classList.remove('on'); }
function paintRest() {
  const left = restante(), m = Math.floor(left / 60), s = left % 60;
  $('#rest-t').textContent = m ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
  $('#rest-f').style.width = (R.total ? 100 - (left / R.total) * 100 : 0) + '%';
}

/* ============ consultas al historial ============ */
function lastEntry(exId, beforeActive = true) {
  for (let i = S.log.length - 1; i >= 0; i--) {
    const s = S.log[i].sets[exId];
    if (s && s.some(x => x.done)) return { sets: s.filter(x => x.done), date: S.log[i].date };
  }
  return null;
}
function allSets(exId) {
  const out = [];
  for (const ses of S.log) {
    const s = ses.sets[exId];
    if (s) { const d = s.filter(x => x.done); if (d.length) out.push({ date: ses.date, sets: d }); }
  }
  return out;
}
const bestOf = sets => sets.reduce((b, x) => {
  const w = x.w || 0, r = x.r || 0;
  const score = w > 0 ? w * 1000 + r : r;
  return !b || score > b.score ? { w, r, score } : b;
}, null);
const e1rm = (w, r) => (w > 0 && r > 0) ? Math.round(w * (1 + r / 30)) : 0;
const volume = sets => sets.reduce((v, x) => v + (x.w || 0) * (x.r || 0), 0);

function prOf(exId) {
  const hist = allSets(exId); if (!hist.length) return null;
  let best = null;
  for (const h of hist) { const b = bestOf(h.sets); if (b && (!best || b.score > best.score)) best = Object.assign({}, b, { date: h.date }); }
  return best;
}

/* Regla del plan: subir peso si cerraste todas las series en el tope de reps. */
function suggestUp(exId, reps) {
  const l = lastEntry(exId); if (!l) return false;
  const t = topReps(reps);
  return l.sets.length >= 2 && l.sets.every(x => (x.r || 0) >= t);
}

function gifSrc(id) { return HAS_GIF.has(id) ? 'gifs/' + id + '.gif' : null; }
function mediaThumb(id, zoom) {
  const g = gifSrc(id);
  return g ? `<img class="ex-media" src="${g}" alt="" loading="lazy">`
    : `<canvas data-anim="${EX[id].anim}" data-zoom="${zoom || 1.24}"></canvas>`;
}

    : `<canvas data-anim="${EX[id].anim}"></canvas>`;

/* Puntuación de una serie para comparar récords (más es mejor). */
function setScore(x) { return (x.w > 0 ? x.w * 1000 + (x.r || 0) : (x.r || 0)); }

/* Cuántos récords personales se batieron en la sesión guardada nº i. */
function sessionRecords(i) {
  const ses = S.log[i];
  let count = 0;
  for (const exId in ses.sets) {
    const done = ses.sets[exId].filter(x => x.done);
    if (!done.length) continue;
    const sb = Math.max(...done.map(setScore));
    let prev = 0;
    for (let j = 0; j < i; j++) {
      const s2 = S.log[j].sets[exId];
      if (s2) s2.filter(x => x.done).forEach(x => { const s = setScore(x); if (s > prev) prev = s; });
    }
    if (sb > 0 && sb > prev) count++;
  }
  return count;
}

/* Mapa muscular de una rutina: series por grupo, en barras. */
function muscleBars(items) {
  const counts = {};
  items.forEach(it => { const m = MUSCLE[it.ex] || 'Otros'; counts[m] = (counts[m] || 0) + it.sets; });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return null;
  const max = Math.max(...entries.map(e => e[1]));
  const sec = el('section');
  sec.innerHTML = `<p class="sect-title">Músculos</p>`;
  const wrap = el('div', 'mbars');
  entries.forEach(([name, n]) => {
    wrap.appendChild(el('div', 'mbar', `<span class="mb-name">${esc(name)}</span><span class="mb-track"><span class="mb-fill" style="width:${Math.max(8, Math.round(n / max * 100))}%"></span></span><span class="mb-n">${n}</span>`));

function exRow(it, sess) {

/* ---------- SESIÓN ---------- */
function newSession() {
  const c = cur(), d = dayOf(c);
  const sets = {};
  d.items.forEach(it => {
    const prev = lastEntry(it.ex);
    sets[it.ex] = Array.from({ length: it.sets }, (_, i) => ({
      w: prev && prev.sets[i] ? prev.sets[i].w : (prev && prev.sets.length ? prev.sets[prev.sets.length - 1].w : null),
      r: null, done: false
    }));
  });
  S.active = { date: today(), kind: c.kind, week: c.week, slot: c.slot, sets, started: Date.now() };
  save();
}

function vSesion(s) {
  const a = S.active;
  if (!a) { tab('hoy'); return; }
  const d = DAYS[a.kind];
  header(s, `Semana ${a.week} · Día ${a.slot}`, d.title, d.subtitle, true);

  const body = el('div', 'stack-lg');
  const list = el('div', 'stack');
  d.items.forEach(it => list.appendChild(exRow(it, a)));
  body.appendChild(list);

  const total = d.items.reduce((n, i) => n + i.sets, 0);
  const done = Object.values(a.sets).flat().filter(x => x.done).length;

  const foot = el('section', 'stack');
  foot.innerHTML = `<p class="hint"><span>Series cerradas</span><b>${done} de ${total}</b></p>`;
  const fin = el('button', 'btn');
  fin.textContent = 'Terminar sesión';
  fin.disabled = done === 0;
  fin.onclick = () => finish();
  foot.appendChild(fin);
  const cancel = el('button', 'btn btn-ghost');
  cancel.textContent = 'Descartar sesión';
  cancel.onclick = () => {
    if (confirm('¿Descartar esta sesión? Se pierde todo lo que has anotado hoy.')) { S.active = null; save(); tab('hoy'); }
  };
  foot.appendChild(cancel);
  foot.appendChild(el('p', '', `<span style="font-family:var(--f-mono);font-size:11px;color:var(--chalk-mute)">${esc(d.note)}</span>`));
  body.appendChild(foot);
  s.appendChild(body);
}

function finish() {
  const a = S.active;
  Object.keys(a.sets).forEach(k => { a.sets[k] = a.sets[k].filter(x => x.done); if (!a.sets[k].length) delete a.sets[k]; });
  S.log.push(a);
  S.active = null;
  S.idx++;
  if (S.idx % 6 === 0) S.cycles++;
  save();
  stopRest();
  beep(2);
  stack = [{ n: 'hoy' }];
  render();
  toast('Sesión guardada. Buen trabajo.');
}

    const vcss = 'font-family:var(--f-num);font-size:21px;font-weight:700';
    const spec = el('div', 'card');
    const inner = el('div');
    inner.style.cssText = 'padding:13px 15px;display:flex;justify-content:space-around;align-items:center;text-align:center';
    inner.innerHTML =
      `<div><div style="${kcss}">Series</div><div style="${vcss}">${it.sets}</div></div>` +
      `<div><div style="${kcss}">Reps</div><div style="${vcss}">${esc(it.reps)}</div></div>`;
    /* Descanso editable por ejercicio */
    const rc = el('div');
    rc.innerHTML = `<div style="${kcss}">Descanso</div>`;
    const rowd = el('div');
    rowd.style.cssText = 'display:flex;align-items:center;gap:9px;margin-top:3px';
    const minus = el('button', 'rest-adj', '−');
    const plus = el('button', 'rest-adj', '+');
    const val = el('div');
    val.style.cssText = vcss + ';min-width:46px';
    const paint = () => { val.textContent = fmtRestShort(restFor(it)); };
    const adj = delta => { S.restEx[it.ex] = Math.min(RESTMAX, Math.max(RESTMIN, baseRest(it) + delta)); save(); paint(); };
    minus.setAttribute('aria-label', 'Menos descanso'); plus.setAttribute('aria-label', 'Más descanso');
    minus.onclick = () => adj(-15); plus.onclick = () => adj(15); paint();
    rowd.append(minus, val, plus); rc.appendChild(rowd);
    inner.appendChild(rc);
    spec.appendChild(inner);
    body.appendChild(spec);
  }

  /* registro de series */
  if (live && it) {
    const sec = el('section');
    sec.innerHTML = `<p class="sect-title">Registro de hoy</p>`;
    const prev = lastEntry(v.ex);
    if (prev) {
      const txt = prev.sets.map(x => fmtSet(x, e.log)).join('  ·  ');
      sec.appendChild(el('p', 'hint', `<span>Sesión anterior (${fmtDate(prev.date)})</span>`));
      sec.appendChild(el('p', '', `<span style="font-family:var(--f-num);font-size:14.5px;color:var(--chalk-dim);font-variant-numeric:tabular-nums">${esc(txt)}</span>`));
    }
    if (suggestUp(v.ex, it.reps)) {
      sec.appendChild(el('div', 'transfer', `Cerraste todas las series en el tope de repeticiones. Toca subir peso.`));
    }
    sec.appendChild(setsEditor(v.ex, it, e));
    body.appendChild(sec);
  }

  /* técnica */
  const tec = el('section');
  tec.innerHTML = `<p class="sect-title">Cómo se hace</p>`;
  const ul = el('ul', 'cues');
  e.cues.forEach((c, i) => ul.appendChild(el('li', '', `<b>${String(i + 1).padStart(2, '0')}</b><span>${esc(c)}</span>`)));
  tec.appendChild(ul);
  body.appendChild(tec);

  /* transferencia */
  const tr = el('section');
  tr.innerHTML = `<p class="sect-title">Para qué sirve en la pista</p>`;
  tr.appendChild(el('div', 'transfer', esc(e.transfer)));
  body.appendChild(tr);

  /* histórico */
  const hist = allSets(v.ex);
  if (hist.length) {
    const h = el('section');
    h.innerHTML = `<p class="sect-title">Tu histórico</p>`;
    h.appendChild(chartCard(e, hist));
    const rows = el('div', 'stack');
    hist.slice(-6).reverse().forEach(x => {
      rows.appendChild(el('div', 'pr', `
        <span class="dt">${esc(fmtDate(x.date))}</span>
        <span class="nm" style="font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:13.5px">${esc(x.sets.map(y => fmtSet(y, e.log)).join(' · '))}</span>`));
    });
    h.appendChild(rows);
    body.appendChild(h);
  }

  s.appendChild(body);
}

/* En español los decimales van con coma. */
const nf = n => String(+(+n).toFixed(2)).replace('.', ',');

function fmtSet(x, log) {
  if (log === 'time') return `${nf(x.r || 0)}s`;
  if (log === 'steps') return `${nf(x.r || 0)} pasos`;
  if (log === 'bw') return (x.w ? `+${nf(x.w)}kg×` : 'PC×') + nf(x.r || 0);
  if (log === 'height') return `${nf(x.w || 0)}cm×${nf(x.r || 0)}`;
  return `${nf(x.w || 0)}kg×${nf(x.r || 0)}`;
}

function setsEditor(exId, it, e) {
  const wrap = el('div', 'sets');
  const arr = S.active.sets[exId];
  const flds = FIELDS[e.log];

  arr.forEach((set, i) => {
    const row = el('div', 'setrow' + (set.done ? ' done' : ''));
    row.style.gridTemplateColumns = flds.length === 1 ? '30px 1fr 46px' : '30px 1fr 1fr 46px';
    row.appendChild(el('span', 'n', String(i + 1)));
    flds.forEach(f => {
      const fd = el('span', 'fld');
      fd.innerHTML = `<label>${f.l}</label><input inputmode="decimal" enterkeyhint="next" placeholder="${f.ph}" value="${set[f.k] ?? ''}">`;
      const inp = fd.querySelector('input');
      inp.oninput = () => { set[f.k] = num(inp.value); save(); };
      wrap.appendChild ? null : null;
      row.appendChild(fd);
    });
    const t = el('button', 'tick');
    t.setAttribute('aria-label', set.done ? 'Deshacer serie' : 'Cerrar serie');
    t.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 12.5l5.2 5.2L20 7"/></svg>`;
    t.onclick = () => {
      if (!set.done) {
        const need = flds.find(f => set[f.k] == null && f.k === 'r');
        if (need) { toast('Anota las repeticiones antes de cerrar la serie.'); return; }
        set.done = true; save();
        row.classList.add('done');
        startRest(restFor(it));
        /* ¿récord? el mejor histórico más lo ya cerrado hoy, sin contar esta serie. */
        let best = 0; const pb = prOf(exId); if (pb) best = pb.score;
        arr.forEach(x => { if (x.done && x !== set) { const sx = setScore(x); if (sx > best) best = sx; } });
        if (setScore(set) > 0 && setScore(set) > best) { row.classList.add('pr'); toast('¡Récord! 🥇 ' + e.tag); }
        else if (arr.every(x => x.done)) toast('Ejercicio completo.');
      } else { set.done = false; save(); row.classList.remove('done'); }
      refreshTick();
    };
    row.appendChild(t);
    wrap.appendChild(row);
  });
  function refreshTick() { }
  return wrap;
}

/* ---------- TÚ · Resumen (antes Progreso) ---------- */
function progResumen(body) {
  const k = el('div', 'kpis');
  const sess = S.log.length;
  /* Los unilaterales (perSide) se hacen a las dos piernas/lados con la misma
     carga, pero solo se registra una serie: cuentan el doble en el total. */
  const totalVol = S.log.reduce((v, s2) => v + Object.entries(s2.sets)
    .reduce((a, [exId, arr]) => a + volume(arr) * (EX[exId] && EX[exId].perSide ? 2 : 1), 0), 0);
  const jump = S.jump.length ? S.jump[S.jump.length - 1] : null;
  const jumpPrev = S.jump.length > 1 ? S.jump[S.jump.length - 2] : null;
  const bw = S.body.length ? S.body[S.body.length - 1] : null;
  const bwPrev = S.body.length > 1 ? S.body[S.body.length - 2] : null;

  k.appendChild(el('div', 'kpi', `<div class="k">Sesiones</div><div class="v">${sess}</div><div class="d">${S.cycles} ciclo${S.cycles === 1 ? '' : 's'} completo${S.cycles === 1 ? '' : 's'}</div>`));
  k.appendChild(el('div', 'kpi', `<div class="k">Volumen total</div><div class="v">${totalVol >= 1000 ? nf(totalVol / 1000) : nf(totalVol)}<small>${totalVol >= 1000 ? 't' : 'kg'}</small></div><div class="d">peso × reps acumulado</div>`));
  k.appendChild(el('div', 'kpi', `<div class="k">Salto (cajón)</div><div class="v">${jump ? nf(jump.cm) : '—'}<small>${jump ? 'cm' : ''}</small></div>

  k.appendChild(el('div', 'kpi', `<div class="k">Peso corporal</div><div class="v">${bw ? nf(bw.kg) : '—'}<small>${bw ? 'kg' : ''}</small></div>

  const withData = Object.keys(EX).filter(id => allSets(id).length);

    body.appendChild(el('div', 'empty', 'Aún no hay nada que medir.<br>Cierra tu primera sesión y aquí empezarán a salir las curvas.'));

  }
  const pr = el('section');

    const b = prOf(id), e = EX[id];

  const ch = el('section');

/* ---------- gráficas ---------- */
function chartCard(e, hist) {
  const pts = hist.map(h => { const b = bestOf(h.sets); return { d: h.date, v: e.log === 'time' || e.log === 'steps' ? b.r : (b.w || b.r) }; });
  const unit = UNIT[e.log];
  return simpleChart(e.tag, pts, unit);
}

function simpleChart(title, pts, unit) {
  const c = el('div', 'chart');
  const last = pts[pts.length - 1].v, first = pts[0].v;
  const diff = last - first;
  c.innerHTML = `<div class="top"><strong>${esc(title)}</strong><span>${nf(last)} ${unit}${pts.length > 1 && diff !== 0 ? ` <span style="color:var(--chalk-mute);font-size:12px">(${diff > 0 ? '+' : ''}${nf(diff)})</span>` : ''}</span></div><canvas></canvas>`;
  const cv = c.querySelector('canvas');
  requestAnimationFrame(() => drawChart(cv, pts, unit));
  return c;
}

function drawChart(cv, pts, unit) {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  const r = cv.getBoundingClientRect();
  const w = Math.max(r.width, 200), h = 148;
  cv.width = w * dpr; cv.height = h * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);

  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  const chalk = g('--chalk'), mute = g('--chalk-mute'), hair = g('--hair-soft'), leather = g('--leather');

  const padL = 6, padR = 34, padT = 12, padB = 20;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1); }
  const pad = (hi - lo) * 0.18; lo -= pad; hi += pad;
  const X = i => padL + (i / Math.max(1, pts.length - 1)) * (w - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB);

  /* rejilla */
  x.strokeStyle = hair; x.lineWidth = 1;
  for (let i = 0; i <= 2; i++) {
    const yy = padT + (i / 2) * (h - padT - padB);
    x.beginPath(); x.moveTo(padL, yy); x.lineTo(w - padR, yy); x.stroke();
  }
  x.fillStyle = mute; x.font = `10px ${g('--f-mono') || 'monospace'}`; x.textAlign = 'left';
  x.fillText(String(+hi.toFixed(0)), w - padR + 6, padT + 4);
  x.fillText(String(+lo.toFixed(0)), w - padR + 6, h - padB + 4);

  /* área */
  const grad = x.createLinearGradient(0, padT, 0, h - padB);
  grad.addColorStop(0, leather + '38'); grad.addColorStop(1, leather + '00');
  x.beginPath();
  pts.forEach((p, i) => i ? x.lineTo(X(i), Y(p.v)) : x.moveTo(X(i), Y(p.v)));
  x.lineTo(X(pts.length - 1), h - padB); x.lineTo(X(0), h - padB); x.closePath();
  x.fillStyle = grad; x.fill();

  /* línea */
  x.beginPath();
  pts.forEach((p, i) => i ? x.lineTo(X(i), Y(p.v)) : x.moveTo(X(i), Y(p.v)));
  x.strokeStyle = leather; x.lineWidth = 2.2; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke();

  /* puntos */
  pts.forEach((p, i) => {
    const isLast = i === pts.length - 1;
    x.beginPath(); x.arc(X(i), Y(p.v), isLast ? 4.6 : 2.6, 0, 7);
    x.fillStyle = isLast ? leather : hair; x.fill();
    if (isLast) { x.lineWidth = 2.4; x.strokeStyle = g('--panel'); x.stroke(); }
  });

  /* fechas extremas */
  x.fillStyle = mute; x.font = `10px ${g('--f-mono') || 'monospace'}`;
  x.textAlign = 'left'; x.fillText(fmtDate(pts[0].d), padL, h - 5);
  x.textAlign = 'right'; x.fillText(fmtDate(pts[pts.length - 1].d), w - padR, h - 5);
}

/* ============ tabs ============ */
const TABS = [
  ['inicio', 'Inicio', '<path d="M4 20V9.5L12 3l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>'],
  ['hoy', 'Hoy', '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'],
  ['nuevo', '', '<path d="M12 5.5v13M5.5 12h13"/>'],
  ['biblio', 'Biblioteca', '<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8.5 3v3M15.5 3v3"/>'],
  ['tu', 'Tú', '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>']
];
/* Qué pestaña resalta cada pantalla apilada. */
const TAB_OF = { sesion: 'hoy', ex: 'biblio', lista: 'biblio', ajustes: 'tu' };
function paintTabs(active) {
  const bar = $('.tabbar');
  if (!bar.children.length) {
    TABS.forEach(([k, l, p]) => {
      const b = el('button', k === 'nuevo' ? 'tb-plus' : '', `<svg viewBox="0 0 24 24">${p}</svg>${l ? `<span>${l}</span>` : ''}`);
      b.onclick = k === 'nuevo' ? startWorkout : () => { if (here().n !== k) tab(k); };
      b.dataset.k = k;
      bar.appendChild(b);
    });
  }
  /* La pestaña marcada es la raíz de la pila, no la pantalla actual. */
  const root = stack[0].n;
  const cur = TAB_OF[root] || root;
  [...bar.children].forEach(b => b.setAttribute('aria-current', b.dataset.k === cur));
}

/* ============ tema ============ */
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', S.theme);
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = $('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#131110' : '#F0E3CB');
}

/* Deja la cabecera lista para "Añadir a pantalla de inicio", venga de donde venga
   la página. Safari lee estas etiquetas al instalar, no solo al cargar. */
function installMeta() {
  const head = document.head;
  const set = (sel, tag, attrs) => {
    let n = head.querySelector(sel);
    if (!n) { n = document.createElement(tag); head.appendChild(n); }
    for (const k in attrs) n.setAttribute(k, attrs[k]);
  };
  set('meta[name="viewport"]', 'meta', { name: 'viewport', content: 'width=device-width, initial-scale=1, viewport-fit=cover' });
  set('meta[name="apple-mobile-web-app-capable"]', 'meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  set('meta[name="mobile-web-app-capable"]', 'meta', { name: 'mobile-web-app-capable', content: 'yes' });
  set('meta[name="apple-mobile-web-app-status-bar-style"]', 'meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });
  set('meta[name="apple-mobile-web-app-title"]', 'meta', { name: 'apple-mobile-web-app-title', content: 'VERTICAL' });
  set('meta[name="theme-color"]', 'meta', { name: 'theme-color', content: '#131110' });
  if (window.VERTICAL_ICON) {
    set('link[rel="apple-touch-icon"]', 'link', { rel: 'apple-touch-icon', href: window.VERTICAL_ICON });
    set('link[rel="icon"]', 'link', { rel: 'icon', type: 'image/png', href: window.VERTICAL_ICON });
  }
  document.title = 'VERTICAL';
}

/* Si la app se sirve desde un origen HTTPS propio, registra el service worker:
   es lo que la deja instalada de verdad y funcionando sin cobertura. */
function installOffline() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('./sw.js').catch(() => { /* sin sw, la app sigue igual */ });
}

/* Lo que suena, dentro de la barra de descanso. */
function pintarPista(p) {
  const box = $('#rest-pista');
  if (!box) return;
  if (!p || !p.titulo) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = (p.portada ? `<img src="${esc(p.portada)}" alt="">` : '') +
    `<span>${esc(p.titulo)}<br><span style="color:var(--chalk-mute)">${esc(p.artista || '')}</span></span>`;
}

/* ============ arranque ============ */
function boot() {
  installMeta();
  installOffline();
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); SPOT.repintar(); });
  $('#rest-skip').onclick = stopRest;
  $('#rest-add').onclick = () => { R.endAt += 30000; R.total = Math.max(R.total, restante()); paintRest(); };
  if (S.active) stack = [{ n: 'hoy' }];
  render();

  /* Spotify: recoger la vuelta del login y empezar a mirar qué suena. */
  SPOT.onPista(pintarPista);
  SPOT.volviendoDeSpotify().then(res => {
    if (res && res.ok) { go({ n: 'ajustes' }); toast('Spotify conectado.'); }
    else if (res) { go({ n: 'ajustes' }); toast(res.msg); }
    SPOT.arrancar();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { SPOT.arrancar(); if (R.iv) tickRest(); } else SPOT.parar();
  });
}

</script>
<script>boot();</script>
